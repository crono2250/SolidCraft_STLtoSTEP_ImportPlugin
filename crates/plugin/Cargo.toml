[package]
name = "solidcraft-stl-to-step-plugin"
version = "0.2.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
stl-reconstruction = { path = "../reconstruction" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wit-bindgen = "0.63"
