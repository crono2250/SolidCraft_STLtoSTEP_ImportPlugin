name: Build installable plugin
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
env:
  CARGO_BUILD_JOBS: 2
  RUST_TEST_THREADS: 2
  RAYON_NUM_THREADS: 2
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
jobs:
  native:
    name: Native reconstruction regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc
        with:
          toolchain: '1.99.1'
          components: rustfmt
      - name: Prepare pinned Native SDK
        run: python3 tools/prepare_sdk.py
      - name: Record native inputs and resources
        run: |
          git rev-parse HEAD
          rustc --version --verbose
          sha256sum "$(rustup which rustc)" Cargo.lock native/sdk-Cargo.lock sdk-lock.json vendor/sdk/.sdk-receipt.json
          getconf _NPROCESSORS_ONLN
          free -m
          df -h .
      - name: Prepare both locked dependency graphs
        run: |
          cargo fetch --locked
          cargo fetch --locked --manifest-path vendor/sdk/solidcore/Cargo.toml
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Native reconstruction and adapter regressions
        run: |
          cargo test --locked --workspace
          cargo test --locked --manifest-path vendor/sdk/solidcore/Cargo.toml -p solidcore --lib mesh_reconstruction
          cargo test --locked --manifest-path vendor/sdk/solidcore/Cargo.toml -p solidcore-ops --lib mesh_
  plugin:
    name: Build and verify installable package
    needs: native
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc
        with:
          toolchain: '1.99.1'
          targets: wasm32-unknown-unknown
      - name: Prepare pinned Native SDK and dependencies
        run: |
          python3 tools/prepare_sdk.py
          cargo fetch --locked
      - name: Record package build inputs and resources
        run: |
          git rev-parse HEAD
          rustc --version --verbose
          cargo --version
          sha256sum "$(rustup which rustc)" Cargo.lock sdk-lock.json native/sdk-integration.patch native/overlay-lock.json vendor/sdk/.sdk-receipt.json
          getconf _NPROCESSORS_ONLN
          free -m
          df -h .
      - name: Compile portable component
        run: |
          export RUSTFLAGS="--remap-path-prefix=$GITHUB_WORKSPACE=/plugin --remap-path-prefix=$HOME/.cargo=/cargo"
          cargo build --locked --release -p solidcraft-stl-to-step-plugin --target wasm32-unknown-unknown
          python3 tools/package.py
          python3 tools/verify_package.py dist/stl-to-step-import-0.1.0.zip
      - name: Verify real SolidCraft installation and conversion
        run: python3 tools/host_smoke.py dist/stl-to-step-import-0.1.0.zip
      - name: Upload directly installable artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: stl-to-step-import-0.1.0
          path: dist/package/*
          if-no-files-found: error
          retention-days: 30
          compression-level: 9
